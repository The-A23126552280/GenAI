[project]
name = "research-paper-agent"
version = "0.1.0"
description = "Experiment 8: multi-agent research paper generation system (2026-compatible)"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.40",
    "langgraph>=0.3",
    "litellm>=1.50",
    "tavily-python>=0.5",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-mock>=3", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
